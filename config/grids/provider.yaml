sylius_grid:
    grids:
        guiziweb_sylius_ai_platform_admin_provider:
            driver:
                name: doctrine/orm
                options:
                    class: "%guiziweb_sylius_ai_platform.model.provider.class%"
            sorting:
                code: asc
            limits: [10, 25, 50]
            fields:
                code:
                    type: string
                    label: guiziweb_sylius_ai_platform.grid.provider.code
                    sortable: ~
                type:
                    type: twig
                    label: guiziweb_sylius_ai_platform.grid.provider.type
                    sortable: ~
                    options:
                        template: '@SyliusUi/grid/field/humanized.html.twig'
                enabled:
                    type: twig
                    label: guiziweb_sylius_ai_platform.grid.provider.enabled
                    sortable: ~
                    options:
                        template: '@SyliusAdmin/shared/grid/field/boolean.html.twig'
                        vars:
                            th_class: 'w-1 text-center'
                            td_class: 'text-center'
            filters:
                search:
                    type: string
                    label: guiziweb_sylius_ai_platform.grid.provider.search
                    options:
                        fields: [code, type]
                    form_options:
                        type: contains
                enabled:
                    type: boolean
                    label: guiziweb_sylius_ai_platform.grid.provider.enabled
            actions:
                item:
                    update:
                        type: update
                    delete:
                        type: delete
                bulk:
                    delete:
                        type: delete
