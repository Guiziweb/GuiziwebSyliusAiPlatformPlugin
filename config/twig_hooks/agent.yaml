sylius_twig_hooks:
    hooks:
        'sylius_admin.agent.update.content':
            form:
                component: 'guiziweb_sylius_ai_platform:agent:form'
                props:
                    resource: '@=_context.resource'
                    form: '@=_context.form'
                    template: '@GuiziwebSyliusAiPlatformPlugin/admin/agent/form.html.twig'
                configuration:
                    method: 'PUT'
                priority: 0

        'sylius_admin.agent.update.content.form.sections.general':
            default:
                enabled: false
            provider:
                template: '@GuiziwebSyliusAiPlatformPlugin/admin/agent/form/sections/general/provider.html.twig'
                priority: 200
            model:
                template: '@GuiziwebSyliusAiPlatformPlugin/admin/agent/form/sections/general/model.html.twig'
                priority: 100
            prompt:
                template: '@GuiziwebSyliusAiPlatformPlugin/admin/agent/form/sections/general/prompt.html.twig'
                priority: 0
