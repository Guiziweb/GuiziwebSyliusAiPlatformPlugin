# Delete these routes and define your own shop routes here

guiziweb_sylius_ai_platform_static_welcome:
    path: /static-welcome/{name}
    defaults:
        _controller: Guiziweb\SyliusAiPlatformPlugin\Controller\GreetingController::staticallyGreetAction
        name: ~

guiziweb_sylius_ai_platform_dynamic_welcome:
    path: /dynamic-welcome/{name}
    defaults:
        _controller: Guiziweb\SyliusAiPlatformPlugin\Controller\GreetingController::dynamicallyGreetAction
        name: ~
